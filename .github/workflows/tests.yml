name: Tests

on:
  push:
  pull_request:

jobs:
  dotnet-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pure C# tests (Core/AI, no Unity)
        run: dotnet test tests/TurboPattes.Tests/TurboPattes.Tests.csproj --nologo
